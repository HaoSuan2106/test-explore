<svg xmlns="http://www.w3.org/2000/svg" width="390" height="960" viewBox="0 0 390 960" font-family="Plus Jakarta Sans, sans-serif">
  <g id="Background">
    <rect width="390" height="960" fill="#FFFFFF"/>
  </g>

  <g id="Top bar">
    <g id="Back arrow" fill="none" stroke="#AB3510" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 32 H40"/>
      <path d="M33 27 L28 32 L33 37"/>
    </g>
    <text x="56" y="38" font-size="16" font-weight="400" fill="#AB3510">Change Password</text>
  </g>

  <g id="Description">
    <text x="20" y="87" font-size="14" font-weight="400" fill="#64748B">Please enter your current password and choose a</text>
    <text x="20" y="107" font-size="14" font-weight="400" fill="#64748B">new, secure one to protect your account.</text>
  </g>

  <g id="Section / Current password">
    <text x="20" y="157" font-size="14" font-weight="700" fill="#101C2C">Current Password</text>
    <rect x="20" y="170" width="350" height="52" rx="26" fill="#FFFFFF" stroke="#DCE3ED"/>
    <text x="40" y="201" font-size="14" font-weight="400" fill="#64748B">Enter current password</text>
    <g id="Icon eye" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round">
      <path d="M332 196c3-4 6.5-6 9.5-6s6.5 2 9.5 6c-3 4-6.5 6-9.5 6s-6.5-2-9.5-6z"/>
      <circle cx="341.5" cy="196" r="2.5"/>
    </g>
  </g>

  <g id="Button / Check">
    <rect x="20" y="242" width="350" height="52" rx="26" fill="#FF7148"/>
    <text x="180" y="274" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Check</text>
    <g id="Icon verified" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M216 259l2.6-2.4 3.5.5 1.9-3 3.3 1.3 3.3-1.3 1.9 3 3.5-.5 2.6 2.4-1.3 3.3 1.3 3.3-2.6 2.4-3.5-.5-1.9 3-3.3-1.3-3.3 1.3-1.9-3-3.5.5-2.6-2.4 1.3-3.3z" opacity="0.9"/>
      <path d="M222.5 262.5l2.8 2.8 5-5"/>
    </g>
  </g>

  <g id="Link / Reset via email">
    <text x="195" y="322" font-size="12" text-anchor="middle">
      <tspan font-weight="400" fill="#64748B">Lost your current password? </tspan><tspan font-weight="700" fill="#AB3510">Reset via Email</tspan>
    </text>
  </g>

  <g id="Divider">
    <line x1="20" y1="366" x2="370" y2="366" stroke="#DCE3ED" stroke-width="1"/>
  </g>

  <g id="Section / New password">
    <text x="20" y="420" font-size="14" font-weight="700" fill="#101C2C">New Password</text>
    <rect x="20" y="433" width="350" height="52" rx="26" fill="#E5E7EB" stroke="#DCE3ED"/>
    <text x="40" y="464" font-size="14" font-weight="400" fill="#64748B">Min. 8 characters</text>
    <g id="Icon eye 2" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round">
      <path d="M332 459c3-4 6.5-6 9.5-6s6.5 2 9.5 6c-3 4-6.5 6-9.5 6s-6.5-2-9.5-6z"/>
      <circle cx="341.5" cy="459" r="2.5"/>
    </g>
  </g>

  <g id="Password requirements (disabled)">
    <g id="Requirement 1">
      <circle cx="27" cy="500" r="7" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
      <text x="42" y="504" font-size="12" font-weight="400" fill="#9CA3AF">At least 8 characters</text>
    </g>
    <g id="Requirement 2">
      <circle cx="27" cy="518" r="7" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
      <text x="42" y="522" font-size="12" font-weight="400" fill="#9CA3AF">Contains an uppercase letter</text>
    </g>
    <g id="Requirement 3">
      <circle cx="27" cy="536" r="7" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
      <text x="42" y="540" font-size="12" font-weight="400" fill="#9CA3AF">Contains a lowercase letter</text>
    </g>
    <g id="Requirement 4">
      <circle cx="27" cy="554" r="7" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
      <text x="42" y="558" font-size="12" font-weight="400" fill="#9CA3AF">Contains a number</text>
    </g>
    <g id="Requirement 5">
      <circle cx="27" cy="572" r="7" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
      <text x="42" y="576" font-size="12" font-weight="400" fill="#9CA3AF">Contains a symbol</text>
    </g>
  </g>

  <g id="Section / Confirm new password">
    <text x="20" y="644" font-size="14" font-weight="700" fill="#101C2C">Confirm New Password</text>
    <rect x="20" y="657" width="350" height="52" rx="26" fill="#E5E7EB" stroke="#DCE3ED"/>
    <text x="40" y="688" font-size="14" font-weight="400" fill="#64748B">Re-enter new password</text>
    <g id="Icon eye 3" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round">
      <path d="M332 683c3-4 6.5-6 9.5-6s6.5 2 9.5 6c-3 4-6.5 6-9.5 6s-6.5-2-9.5-6z"/>
      <circle cx="341.5" cy="683" r="2.5"/>
    </g>
  </g>

  <g id="Button / Update password (disabled)">
    <rect x="20" y="749" width="350" height="52" rx="26" fill="#E5E7EB"/>
    <text x="178" y="781" font-size="16" font-weight="700" fill="#64748B" text-anchor="middle">Update Password</text>
    <g id="Icon check circle" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="253" cy="775" r="9"/>
      <path d="M249 775l3 3 5.5-5.5"/>
    </g>
  </g>

  <g id="Button / Cancel">
    <rect x="20" y="817" width="350" height="52" rx="26" fill="#FFFFFF" stroke="#DCE3ED"/>
    <text x="195" y="849" font-size="16" font-weight="700" fill="#101C2C" text-anchor="middle">Cancel</text>
  </g>

  <g id="Footer note">
    <text x="195" y="917" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">Secure encryption is used to protect your credentials.</text>
  </g>
</svg>
